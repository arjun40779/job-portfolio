name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Check, lint, build, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm check

      - name: Unit tests
        run: pnpm test:unit

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build (production)
        run: pnpm build

      - name: End-to-end tests (production)
        run: pnpm test:e2e

      # Draft builds add unapproved and placeholder content (e.g. case studies)
      # so those pages are tested and measured before they can ship.
      - name: Build (drafts)
        run: pnpm build
        env:
          SHOW_DRAFTS: "true"

      - name: End-to-end tests (drafts)
        run: pnpm test:e2e
        env:
          SHOW_DRAFTS: "true"

      - name: Lighthouse budgets (drafts build, includes case studies)
        run: pnpm lhci

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            playwright-report/
            .lighthouseci/
          retention-days: 7
